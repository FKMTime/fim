services:
  backend:
    image: "ghcr.io/fkmtime/fkmtime-backend:main"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - DATABASE_URL=postgres://root:password@database:5432/fkm_time
      - SOCKET_PATH=/app/sock/socket.sock
      - DEVICE_LOGS_DIR=/device-logs
      - BACKEND_LOGS_DIR=/backend-logs
      - WCA_CLIENT_ID=example-application-id
      - WCA_CLIENT_SECRET=example-secret
      - WCA_LIVE_API_ORIGIN=http://nginx:80/dummy-wca-live/api
      - WCA_ORIGIN=http://nginx:80/dummy-wca
    env_file:
      - .env
    volumes:
      - sock:/app/sock
      # The connector's device logs, read-only, for admins to watch from
      # the panel (FKMTime SPEC-009)
      - ./logs:/device-logs:ro
      # The backend's own log, for admins to read from the panel
      # (FKMTime SPEC-011)
      - ./logs/backend:/backend-logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 50
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fkm_time
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 50
  dummy_wca:
    restart: unless-stopped
    image: maxidragon/dummy-wca:main
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
  dummy_wca_live:
    restart: unless-stopped
    image: maxidragon/dummy-wca-live:main
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
  nginx:
    image: "ghcr.io/fkmtime/fkmtime-nginx:main"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - BACKEND_ORIGIN=/api
      - WCA_CLIENT_ID=example-application-id
      - WCA_CLIENT_SECRET=example-secret
      - WCA_LIVE_API_ORIGIN=/dummy-wca-live/api
      - WCA_ORIGIN=/dummy-wca
    env_file:
      - .env
    volumes:
      # The image includes /etc/nginx/demo/*.conf but ships no routes there
      # (FKMTime #745); without these, /dummy-wca/ falls through to the
      # panel's 404 and nobody can sign in
      - ./nginx/demo:/etc/nginx/demo:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
  micro_connector:
    image: "ghcr.io/fkmtime/fkmtime-micro-connector:master"
    network_mode: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - /run/dbus:/run/dbus:ro
      - ./logs:/logs
      - sock:/app/sock
    environment:
      - PORT=8081
      - FIRMWARE_DIR=/app/firmware
      - RUST_LOG=none,backend=debug
      - DEVICE_LOGS=/logs
      - SOCKET_PATH=/app/sock/socket.sock
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
volumes:
  sock:
