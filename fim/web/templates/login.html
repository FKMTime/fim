<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FKMTime — Login</title>
<link rel="stylesheet" href="/static/login.css">
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <span class="login-mark" aria-hidden="true">FKM</span>
    <h1>FKMTime Manager</h1>
  </div>
  <p class="login-sub">Sign in to manage instances</p>
  <div class="field">
    <label for="u">Username</label>
    <input type="text" id="u" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label for="p">Password</label>
    <input type="password" id="p" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  </div>
  <button type="button" class="login-btn" onclick="login()">Sign in</button>
  <div id="err" class="login-error" role="alert"></div>
</div>
<script>
async function login() {
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('u').value,
      password: document.getElementById('p').value,
    }),
  });
  const d = await r.json();
  if (d.ok) window.location.href = '/';
  else document.getElementById('err').textContent = 'Invalid credentials';
}
</script>
</body>
</html>
